name: Publish release, Docker image, and Homebrew bottle

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish as a Docker image, GitHub Release, and Homebrew bottle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-tags:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Resolve release and image tags
        id: tags
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$PUSHED_TAG"
          fi

          image_tag="${release_tag#v}"
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Tag '$release_tag' cannot be converted to a valid Docker tag" >&2
            exit 1
          fi

          echo "release=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image=$image_tag" >> "$GITHUB_OUTPUT"

  build-and-push-architecture:
    needs: resolve-tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/modeltap:${{ needs.resolve-tags.outputs.image }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=modeltap-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=modeltap-${{ matrix.architecture }}

  publish-manifest:
    needs:
      - resolve-tags
      - build-and-push-architecture
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/modeltap
          IMAGE_TAG: ${{ needs.resolve-tags.outputs.image }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --tag "$IMAGE_REPOSITORY:latest" \
            "$IMAGE_REPOSITORY:$IMAGE_TAG-amd64" \
            "$IMAGE_REPOSITORY:$IMAGE_TAG-arm64"

  build-release-binaries:
    needs: resolve-tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release binary
        env:
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/modeltap-${RELEASE_TAG}-${TARGET}.tar.gz" modeltap

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: modeltap-${{ matrix.target }}
          path: dist/modeltap-*.tar.gz
          if-no-files-found: error

  build-homebrew-bottle:
    needs: resolve-tags
    runs-on: macos-14
    env:
      TAP_NAME: tenfyzhong/tap
      FORMULA: modeltap
      FORMULA_PATH: ${{ github.workspace }}/homebrew-tap/Formula/modeltap.rb
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tenfyzhong/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Update formula source
        env:
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: |
          set -o pipefail
          source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          source_sha256="$(curl --fail --location --silent --show-error "$source_url" | shasum -a 256 | awk '{print $1}')"

          if [[ -z "$source_sha256" ]]; then
            echo "Could not calculate the source archive checksum" >&2
            exit 1
          fi

          export SOURCE_URL="$source_url"
          export SOURCE_SHA256="$source_sha256"
          ruby <<'RUBY'
          formula_path = ENV.fetch("FORMULA_PATH")
          source_url = ENV.fetch("SOURCE_URL")
          source_sha256 = ENV.fetch("SOURCE_SHA256")
          formula = File.read(formula_path)

          formula.sub!(/^  url ".*"$/, %(  url "#{source_url}")) or abort("Formula URL not found")
          formula.sub!(/^  sha256 ".*"$/, %(  sha256 "#{source_sha256}")) or abort("Formula SHA-256 not found")
          File.write(formula_path, formula)
          RUBY

      - name: Set up Homebrew tap
        run: |
          brew tap "$TAP_NAME"
          brew trust "$TAP_NAME"
          tap_formula_path="$(brew --repository "$TAP_NAME")/Formula/$FORMULA.rb"
          cp "$FORMULA_PATH" "$tap_formula_path"

      - name: Build Homebrew bottle
        env:
          BOTTLE_ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-tags.outputs.release }}
        run: |
          brew uninstall --force "$FORMULA" || true
          brew install --build-bottle "$TAP_NAME/$FORMULA"
          brew bottle --json --no-rebuild --root-url "$BOTTLE_ROOT_URL" "$TAP_NAME/$FORMULA"

      - name: Upload Homebrew bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: modeltap-homebrew-bottle
          path: |
            ./*.bottle.tar.gz
            ./*.bottle.json
          if-no-files-found: error

  publish-release:
    needs:
      - resolve-tags
      - publish-manifest
      - build-release-binaries
      - build-homebrew-bottle
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: modeltap-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release '$RELEASE_TAG' already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  create-formula-bump-pull-request:
    needs:
      - resolve-tags
      - publish-release
    runs-on: macos-14
    env:
      TAP_NAME: tenfyzhong/tap
      FORMULA: modeltap
      FORMULA_PATH: ${{ github.workspace }}/homebrew-tap/Formula/modeltap.rb
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tenfyzhong/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Download Homebrew bottle metadata
        uses: actions/download-artifact@v4
        with:
          name: modeltap-homebrew-bottle
          path: bottle

      - name: Update formula source
        env:
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: |
          set -o pipefail
          source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          source_sha256="$(curl --fail --location --silent --show-error "$source_url" | shasum -a 256 | awk '{print $1}')"

          if [[ -z "$source_sha256" ]]; then
            echo "Could not calculate the source archive checksum" >&2
            exit 1
          fi

          export SOURCE_URL="$source_url"
          export SOURCE_SHA256="$source_sha256"
          ruby <<'RUBY'
          formula_path = ENV.fetch("FORMULA_PATH")
          source_url = ENV.fetch("SOURCE_URL")
          source_sha256 = ENV.fetch("SOURCE_SHA256")
          formula = File.read(formula_path)

          formula.sub!(/^  url ".*"$/, %(  url "#{source_url}")) or abort("Formula URL not found")
          formula.sub!(/^  sha256 ".*"$/, %(  sha256 "#{source_sha256}")) or abort("Formula SHA-256 not found")
          File.write(formula_path, formula)
          RUBY

      - name: Add bottle metadata to formula
        run: |
          brew tap "$TAP_NAME"
          brew trust "$TAP_NAME"
          tap_formula_path="$(brew --repository "$TAP_NAME")/Formula/$FORMULA.rb"
          cp "$FORMULA_PATH" "$tap_formula_path"
          bottle_json="$(find bottle -name '*.bottle.json' -print -quit)"
          if [[ -z "$bottle_json" ]]; then
            echo "Homebrew bottle metadata artifact is missing" >&2
            exit 1
          fi

          brew bottle --merge --write --no-commit "$bottle_json"
          cp "$tap_formula_path" "$FORMULA_PATH"

      - name: Create formula bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: automation/modeltap-${{ needs.resolve-tags.outputs.image }}
          delete-branch: true
          commit-message: "modeltap ${{ needs.resolve-tags.outputs.release }}"
          title: "modeltap ${{ needs.resolve-tags.outputs.release }}"
          body: |
            Updates ModelTap to `${{ needs.resolve-tags.outputs.release }}` and adds the macOS arm64 bottle.
