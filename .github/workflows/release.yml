name: Publish release and Docker image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish as a Docker image and GitHub Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-tags:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Resolve release and image tags
        id: tags
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$PUSHED_TAG"
          fi

          image_tag="${release_tag#v}"
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Tag '$release_tag' cannot be converted to a valid Docker tag" >&2
            exit 1
          fi

          echo "release=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image=$image_tag" >> "$GITHUB_OUTPUT"

  build-and-push-architecture:
    needs: resolve-tags
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/modeltap:${{ needs.resolve-tags.outputs.image }}-${{ matrix.architecture }}

  publish-manifest:
    needs:
      - resolve-tags
      - build-and-push-architecture
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/modeltap
          IMAGE_TAG: ${{ needs.resolve-tags.outputs.image }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --tag "$IMAGE_REPOSITORY:latest" \
            "$IMAGE_REPOSITORY:$IMAGE_TAG-amd64" \
            "$IMAGE_REPOSITORY:$IMAGE_TAG-arm64"

  build-release-binaries:
    needs: resolve-tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release binary
        env:
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/modeltap-${RELEASE_TAG}-${TARGET}.tar.gz" modeltap

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: modeltap-${{ matrix.target }}
          path: dist/modeltap-*.tar.gz
          if-no-files-found: error

  publish-release:
    needs:
      - resolve-tags
      - publish-manifest
      - build-release-binaries
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: modeltap-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release '$RELEASE_TAG' already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

      - name: Upload release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tags.outputs.release }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
