# Copy this file to config.yaml and replace the environment-specific values
# before use. Generate the CA files once with:
#   modeltap ca-init --cert certs/modeltap-ca-cert.pem --key certs/modeltap-ca-key.pem

proxy:
  listen: 127.0.0.1:2080

logging:
  level: info

tls:
  ca_cert_file: ./certs/modeltap-ca-cert.pem
  ca_key_file: ./certs/modeltap-ca-key.pem

telemetry:
  otlp:
    endpoint: http://127.0.0.1:4318
    service_name: modeltap-test

egress:
  default: privoxy
  proxies:
    - id: privoxy
      url: http://127.0.0.1:8118

sites:
  - id: openai
    hosts:
      - chatgpt.com
  - id: anthropic
    hosts:
      - anthropic.com
  - id: gemini
    hosts:
      - googleapis.com
  - id: deepseek
    hosts:
      - api.deepseek.com
    egress: direct
  - id: grok
    hosts:
      - api.x.ai
  - id: cursor
    hosts:
      - cursor.sh
      - cursor.com

pricing:
  timezone: Asia/Shanghai
  # Official first-party API list prices checked on 2026-08-21.
  # All rates are USD per 1M tokens. DeepSeek's official CNY prices use its
  # Beijing-time workday peak windows (weekends are off-peak) and are converted
  # with the 2026-08-19 ECB rates:
  # 1 EUR = 7.8197 CNY and 1 EUR = 1.1605 USD (1 CNY = 0.148407227899 USD).
  #
  # Peak windows can be configured globally or per model rule:
  # - weekdays (optional): Array of days when the peak window applies.
  #   Accepts numbers (1=Monday ... 7=Sunday, e.g. [1, 2, 3, 4, 5]),
  #   short names (["Mon", "Tue", ...]), or full names (["Monday", ...]).
  #   If omitted, defaults to all days [1, 2, 3, 4, 5, 6, 7].
  # - start / end: Time in "HH:MM" format (e.g. "09:00", "12:00").
  peak_windows:
    - weekdays: [1, 2, 3, 4, 5]
      start: "09:00"
      end: "12:00"
    - weekdays: [1, 2, 3, 4, 5]
      start: "14:00"
      end: "18:00"
  rules:
    # Rules without a `site` apply globally to all sites (e.g. direct API access,
    # gateway proxies, or Cursor forwarding). Rules with a `site` override the
    # global rates for that specific site.

    # --------------------------------------------------------------------------
    # Global default pricing (all sites)
    # --------------------------------------------------------------------------

    # Grok / xAI
    - model: "cursor-grok-4.6-*-fast"
      currency: USD
      rates:
        input: 4
        output: 12
        cache_read: 1
    - model: "cursor-grok-4.6-*"
      currency: USD
      rates:
        input: 2
        output: 6
        cache_read: 0.5
    - model: "cursor-grok-4.5-*"
      currency: USD
      rates:
        input: 2
        output: 6
        cache_read: 0.3
    - model: "grok-code-fast-1"
      currency: USD
      rates:
        input: 1
        output: 2
        cache_read: 0.2

    # OpenAI models
    - model: "gpt-5-mini"
      currency: USD
      rates:
        input: 0.25
        output: 2
        cache_read: 0.025
    - model: "gpt-5.1{,-high,-low}"
      currency: USD
      rates:
        input: 1.25
        output: 10
        cache_read: 0.125
    - model: "gpt-5.2{,-high,-low,-xhigh}"
      currency: USD
      rates:
        input: 1.75
        output: 14
        cache_read: 0.175
    - model: "gpt-5.3-codex{,-high,-low,-xhigh}"
      currency: USD
      rates:
        input: 3.5
        output: 28
        cache_read: 0.35
      fast:
        input: 7
        output: 56
        cache_read: 0.7
    - model: "gpt-5.4-{high,low,medium,xhigh}"
      currency: USD
      rates:
        input: 1.25
        output: 7.5
        cache_read: 0.125
    - model: "gpt-5.4-mini-{high,low,medium,none,xhigh}"
      currency: USD
      rates:
        input: 0.75
        output: 4.5
        cache_read: 0.075
    - model: "gpt-5.4-nano-{high,low,medium,none,xhigh}"
      currency: USD
      rates:
        input: 0.2
        output: 1.25
        cache_read: 0.02
    - model: "gpt-5.5-{extra-high,high,low,medium,none}"
      currency: USD
      rates:
        input: 2.5
        output: 15
        cache_read: 0.25
    - model: "gpt-5.6-sol*"
      currency: USD
      rates:
        input: 5
        output: 30
        cache_read: 0.5
      fast:
        input: 10
        output: 60
        cache_read: 1
    - model: "gpt-5.6-terra*"
      currency: USD
      rates:
        input: 2
        output: 12
        cache_read: 0.2
      fast:
        input: 4
        output: 24
        cache_read: 0.4
    - model: "gpt-5.6-luna*"
      currency: USD
      rates:
        input: 0.2
        output: 1.2
        cache_read: 0.02
      fast:
        input: 0.4
        output: 2.4
        cache_read: 0.04

    # Anthropic / Claude models
    - model: "claude-4-sonnet*"
      currency: USD
      rates:
        input: 3
        output: 15
        cache_read: 0.3
        cache_write: 3.75
    - model: "claude-4.5-sonnet*"
      currency: USD
      rates:
        input: 3
        output: 15
        cache_read: 0.3
        cache_write: 3.75
    - model: "claude-4.5-opus*"
      currency: USD
      rates:
        input: 5
        output: 25
        cache_read: 0.5
        cache_write: 6.25
    - model: "claude-4.6-sonnet*"
      currency: USD
      rates:
        input: 3
        output: 15
        cache_read: 0.3
        cache_write: 3.75
    - model: "claude-sonnet-4-6*"
      currency: USD
      rates:
        input: 3
        output: 15
        cache_read: 0.3
        cache_write: 3.75
    - model: "claude-4.6-opus*"
      currency: USD
      rates:
        input: 5
        output: 25
        cache_read: 0.5
        cache_write: 6.25
    - model: "claude-opus-4-7*"
      currency: USD
      rates:
        input: 5
        output: 25
        cache_read: 0.5
        cache_write: 6.25
    - model: "claude-opus-4-8*"
      currency: USD
      rates:
        input: 5
        output: 25
        cache_read: 0.5
        cache_write: 6.25
    - model: "claude-haiku-4-5*"
      currency: USD
      rates:
        input: 1
        output: 5
        cache_read: 0.1
        cache_write: 1.25

    # Google Gemini models
    - model: "gemini-3.7-flash*"
      currency: USD
      rates:
        input: 0.75
        output: 3.75
        cache_read: 0.075

    # DeepSeek models (with peak/off-peak pricing)
    # Peak windows can be configured globally under `pricing.peak_windows`
    # or specified per-model with `peak_windows`.
    - model: "deepseek-v4-flash*"
      currency: USD
      peak_windows:
        - weekdays: [1, 2, 3, 4, 5]
          start: "09:00"
          end: "12:00"
        - weekdays: [1, 2, 3, 4, 5]
          start: "14:00"
          end: "18:00"
      peak:
        input: 0.445221684
        output: 1.335665051
        cache_read: 0.014840723
      off_peak:
        input: 0.222610842
        output: 0.667832526
        cache_read: 0.007420361
    - model: "deepseek-v4-pro*"
      currency: USD
      peak_windows:
        - weekdays: [1, 2, 3, 4, 5]
          start: "09:00"
          end: "12:00"
        - weekdays: [1, 2, 3, 4, 5]
          start: "14:00"
          end: "18:00"
      peak:
        input: 1.335665051
        output: 4.006995153
        cache_read: 0.044522168
      off_peak:
        input: 0.667832526
        output: 2.003497577
        cache_read: 0.022261084

    # --------------------------------------------------------------------------
    # Site-specific overrides
    # --------------------------------------------------------------------------

    # Cursor-specific pricing overrides
    - site: cursor
      model: "gpt-5.6-sol-{high,low,max,medium,none,xhigh}"
      currency: USD
      rates:
        input: 2.5
        output: 15
        cache_read: 0.25
      fast:
        input: 5
        output: 30
        cache_read: 0.5
    - site: cursor
      model: "gpt-5.6-terra-{high,low,max,medium,none,xhigh}"
      currency: USD
      rates:
        input: 1.25
        output: 7.5
        cache_read: 0.125
      fast:
        input: 2.5
        output: 15
        cache_read: 0.25
    - site: cursor
      model: "gpt-5.6-luna-{high,low,max,medium,none,xhigh}"
      currency: USD
      rates:
        input: 0.5
