# Copy this file to config.yaml and replace the environment-specific values
# before use. Generate the CA files once with:
#   modeltap ca-init --cert certs/modeltap-ca-cert.pem --key certs/modeltap-ca-key.pem

proxy:
  listen: 127.0.0.1:2080

logging:
  level: info

tls:
  ca_cert_file: ./certs/modeltap-ca-cert.pem
  ca_key_file: ./certs/modeltap-ca-key.pem

telemetry:
  otlp:
    endpoint: http://127.0.0.1:4318
    service_name: modeltap-test

egress:
  default: privoxy
  proxies:
    - id: privoxy
      url: http://127.0.0.1:8118

sites:
  - id: openai
    hosts:
      - chatgpt.com
  - id: anthropic
    hosts:
      - anthropic.com
  - id: gemini
    hosts:
      - googleapis.com
  - id: deepseek
    hosts:
      - api.deepseek.com
    egress: direct
  - id: grok
    hosts:
      - api.x.ai
  - id: cursor
    hosts:
      - cursor.sh
      - cursor.com

pricing:
  timezone: Asia/Shanghai
  # Official first-party API list prices checked on 2026-08-21.
  # All rates are USD per 1M tokens. DeepSeek's official CNY prices use its
  # Beijing-time peak windows and are converted with the 2026-08-19 ECB rates:
  # 1 EUR = 7.8197 CNY and 1 EUR = 1.1605 USD (1 CNY = 0.148407227899 USD).
  peak_windows:
    - start: "09:00"
      end: "12:00"
    - start: "14:00"
      end: "18:00"
  rules:
    # Cursor is a gateway: apply the applicable upstream provider's public API
    # list price, rather than Cursor plan or usage-based pricing.  Rules for
    # Cursor-only models and Cursor "fast" variants are intentionally omitted
    # unless that provider publishes a corresponding token rate.
    - site: cursor
      model: "cursor-grok-4.6-*-fast"
      currency: USD
      rates:
        input: 4
        output: 12
        cache_read: 1
