<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ModelTap AI usage and cost dashboard preview</title>
  <desc id="desc">An illustrative Grafana-style dashboard with token and cost totals plus agent and model breakdowns.</desc>
  <rect width="1200" height="650" fill="#111827" rx="14"/>
  <rect x="1" y="1" width="1198" height="648" fill="none" stroke="#374151" rx="14"/>
  <text x="38" y="55" fill="#f9fafb" font-family="Arial, sans-serif" font-size="26" font-weight="700">ModelTap — AI Usage &amp; Cost</text>
  <text x="38" y="84" fill="#9ca3af" font-family="Arial, sans-serif" font-size="15">Illustrative data · Filter by agent CLI, site, and model</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(38 120)">
      <rect width="260" height="126" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="34" fill="#d1d5db" font-size="15">Requests / sec</text>
      <text x="20" y="84" fill="#f9fafb" font-size="38" font-weight="700">2.8</text>
      <path d="M20 106 L65 94 L105 101 L150 72 L195 84 L240 55" fill="none" stroke="#60a5fa" stroke-width="3"/>
    </g>
    <g transform="translate(318 120)">
      <rect width="260" height="126" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="34" fill="#d1d5db" font-size="15">Tokens (last 24 hours)</text>
      <text x="20" y="84" fill="#f9fafb" font-size="38" font-weight="700">18.42M</text>
      <text x="20" y="108" fill="#34d399" font-size="14">↑ 12.4% from yesterday</text>
    </g>
    <g transform="translate(598 120)">
      <rect width="260" height="126" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="34" fill="#d1d5db" font-size="15">Estimated cost (USD)</text>
      <text x="20" y="84" fill="#f9fafb" font-size="38" font-weight="700">$37.21</text>
      <text x="20" y="108" fill="#fbbf24" font-size="14">Across all configured prices</text>
    </g>
    <g transform="translate(878 120)">
      <rect width="284" height="126" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="34" fill="#d1d5db" font-size="15">Top agent</text>
      <text x="20" y="75" fill="#f9fafb" font-size="28" font-weight="700">Codex</text>
      <text x="20" y="104" fill="#9ca3af" font-size="15">8.3M tokens · $14.82</text>
    </g>
    <g transform="translate(38 276)">
      <rect width="550" height="330" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="36" fill="#f3f4f6" font-size="17" font-weight="700">Daily tokens by agent CLI</text>
      <g transform="translate(22 62)" font-size="14" fill="#d1d5db">
        <text y="30">Codex</text><rect x="118" y="15" width="320" height="18" fill="#60a5fa" rx="4"/><text x="454" y="30">8.3M</text>
        <text y="82">Claude Code</text><rect x="118" y="67" width="232" height="18" fill="#a78bfa" rx="4"/><text x="366" y="82">5.1M</text>
        <text y="134">oh-my-pi</text><rect x="118" y="119" width="128" height="18" fill="#34d399" rx="4"/><text x="262" y="134">2.7M</text>
        <text y="186">Gemini CLI</text><rect x="118" y="171" width="97" height="18" fill="#fbbf24" rx="4"/><text x="231" y="186">2.1M</text>
      </g>
      <text x="20" y="302" fill="#9ca3af" font-size="13">ModelTap automatically tags observed traffic with the detected agent CLI.</text>
    </g>
    <g transform="translate(612 276)">
      <rect width="550" height="330" fill="#1f2937" stroke="#374151" rx="8"/>
      <text x="20" y="36" fill="#f3f4f6" font-size="17" font-weight="700">Estimated cost by model</text>
      <g transform="translate(22 62)" font-size="14" fill="#d1d5db">
        <text y="30">gpt-5.6-sol</text><rect x="160" y="15" width="280" height="18" fill="#60a5fa" rx="4"/><text x="456" y="30">$14.82</text>
        <text y="82">claude-opus</text><rect x="160" y="67" width="214" height="18" fill="#a78bfa" rx="4"/><text x="390" y="82">$11.26</text>
        <text y="134">gemini</text><rect x="160" y="119" width="142" height="18" fill="#34d399" rx="4"/><text x="318" y="134">$6.17</text>
        <text y="186">other</text><rect x="160" y="171" width="98" height="18" fill="#fbbf24" rx="4"/><text x="274" y="186">$4.96</text>
      </g>
      <text x="20" y="302" fill="#9ca3af" font-size="13">Costs use the pricing rules in your ModelTap configuration.</text>
    </g>
  </g>
</svg>
