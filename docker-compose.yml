services:
  modeltap:
    build:
      context: .
    image: tenfyzhong/modeltap:latest
    command: ["run", "--config", "/etc/modeltap/config.yaml"]
    ports:
      - "2080:2080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/etc/modeltap/config.yaml:ro
      - ./certs/modeltap-ca-cert.pem:/run/modeltap/ca-cert.pem:ro
      - ./certs/modeltap-ca-key.pem:/run/modeltap/ca-key.pem:ro
    restart: unless-stopped
